name: windows-build
on: { workflow_dispatch: {}, release: { types: [published] } }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cd frontend && npm ci && echo x > .tauri-export && $env:TAURI_BUILD='1'; $env:NEXT_PUBLIC_API_URL='https://posao.kolektiv.pro'; node -e "console.log('diag-env:', !!process.env.TAURI_BUILD, 'diag-flag:', require('fs').existsSync('.tauri-export'))"; npm run build && rm .tauri-export && node -e "console.log('diag-out:', require('fs').existsSync('out/index.html'))"
      - uses: tauri-apps/tauri-action@v0
        with: { projectPath: desktop }
      - uses: actions/upload-artifact@v4
        with: { name: AgentMujoJob-windows, path: "desktop/src-tauri/target/release/bundle/**/*.msi" }
