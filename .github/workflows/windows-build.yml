name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci
      - run: Remove-Item -Path frontend/out -Force -ErrorAction SilentlyContinue
      - run: node scripts/tauri-export-build.js
      - run: tauri-apps/tauri-action@v0
        env:
          TAURI_BUILD: '1'
          NEXT_PUBLIC_API_URL: 'https://posao.kolektiv.pro'