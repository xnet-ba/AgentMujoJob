[package]
name = "agentmujojob"
version = "1.0.3"
edition = "2021"

[lib]
name = "agentmujojob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
