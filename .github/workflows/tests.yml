name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm test && npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! grep -rEi 'ghp_[A-Za-z0-9]{20,}|xapp_[A-Za-z0-9]{20,}|sk-live-[A-Za-z0-9]+|ADMIN_TOKEN=.+' --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' . | grep -v example | grep -v test_ | grep -v '.next/' || true"
      - run: "! grep -rEi 'home/[a-z0-9_]+/|hestia|185\\.255|@kolektiv\\.pro|/usr/local/hestia' --include='*.md' --include='*.py' --include='*.ts' --include='*.tsx' --include='*.example' --include='*.service' --include='*.conf' --include='*.yml' . | grep -v '.next/' | grep -v node_modules || true"
